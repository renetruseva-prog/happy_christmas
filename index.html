<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Baking Simulator</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #0d0a08; }
      #hint {
        position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
        padding: 8px 16px; border-radius: 999px;
        background: rgba(20, 12, 8, 0.75); color: #ffe8c8;
        font: 500 14px/1.2 system-ui, sans-serif; text-transform: capitalize;
        pointer-events: none; opacity: 0; transition: opacity 0.15s;
      }
      #status {
        position: fixed; left: 20px; top: 20px;
        padding: 8px 16px; border-radius: 999px;
        background: rgba(20, 12, 8, 0.75); color: #ffe8c8;
        font: 500 14px/1.2 system-ui, sans-serif;
        pointer-events: none; opacity: 0; transition: opacity 0.3s;
      }
      /* camera mixing: the button to switch it on, and a mirrored preview with the tracked hand */
      #camera-btn {
        position: fixed; right: 20px; top: 20px;
        padding: 8px 16px; border: 0; border-radius: 999px;
        background: rgba(179, 32, 42, 0.9); color: #fff3e6;
        font: 600 14px/1.2 system-ui, sans-serif; cursor: pointer;
        opacity: 0; pointer-events: none; transition: opacity 0.2s;
      }
      #camera-btn.show { opacity: 1; pointer-events: auto; }
      #camera {
        position: fixed; right: 20px; bottom: 20px; width: 240px; aspect-ratio: 4 / 3;
        border-radius: 12px; overflow: hidden; background: #000;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
      }
      #camera.on { opacity: 1; }

      /* "time to mix": asks to use the camera (or the mouse) once all the ingredients are in */
      #mix-intro {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(8, 5, 3, 0.55); backdrop-filter: blur(3px);
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
      }
      #mix-intro.show { opacity: 1; pointer-events: auto; }
      #mix-intro .card {
        width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 28px 28px 22px;
        border-radius: 20px; background: #2a1a12; color: #ffe8c8; text-align: center;
        font: 400 15px/1.45 system-ui, sans-serif; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        transform: translateY(12px) scale(0.97); transition: transform 0.3s;
      }
      #mix-intro.show .card { transform: none; }
      #mix-intro .badge { font-size: 40px; line-height: 1; }
      #mix-intro h2 { margin: 10px 0 6px; font-size: 22px; color: #fff3e6; }
      #mix-intro p { margin: 0 0 10px; }
      #mix-intro .privacy { font-size: 13px; color: #d9bfa0; }
      #mix-intro .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
      #mix-intro button {
        padding: 12px 18px; border-radius: 999px; border: 0; cursor: pointer;
        font: 600 15px/1.2 system-ui, sans-serif;
      }
      #mix-intro button:disabled { opacity: 0.6; cursor: default; }
      #use-camera { background: #b3202a; color: #fff3e6; }
      #use-mouse { background: transparent; color: #ffe8c8; box-shadow: inset 0 0 0 1.5px rgba(255, 232, 200, 0.4); }
      #mix-intro .note { min-height: 1.4em; margin: 12px 0 0; font-size: 13px; color: #ffd27a; }

      /* the little tutorial while mixing: an icon going round a circle */
      #tutorial {
        position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 8px);
        display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 10px;
        border-radius: 18px; background: rgba(20, 12, 8, 0.82); color: #ffe8c8;
        font: 500 14px/1.35 system-ui, sans-serif; pointer-events: none;
        opacity: 0; transition: opacity 0.4s, transform 0.4s;
      }
      #tutorial.show { opacity: 1; transform: translate(-50%, 0); }
      #tutorial svg { width: 64px; height: 64px; flex: none; }
      #tutorial .track { fill: none; stroke: rgba(255, 232, 200, 0.35); stroke-width: 3; stroke-dasharray: 5 6; }
      #tutorial .arrow { fill: rgba(255, 232, 200, 0.6); }
      #tutorial b { color: #fff3e6; }
      #tutorial small { display: block; color: #d9bfa0; font-size: 12px; }
      #camera video, #camera canvas {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        transform: scaleX(-1); /* like a mirror */
      }
    </style>
  </head>
  <body>
    <div id="hint"></div>
    <div id="status"></div>
    <button id="camera-btn" type="button">Mix with your hand (C)</button>
    <div id="camera"><video playsinline muted></video><canvas></canvas></div>

    <div id="mix-intro" role="dialog" aria-modal="true" aria-labelledby="mix-intro-title">
      <div class="card">
        <div class="badge">🎄</div>
        <h2 id="mix-intro-title">Time to mix the dough!</h2>
        <p>Stir with your <b>real hand</b> in front of your webcam, or with the mouse.</p>
        <p class="privacy">The camera picture stays on your computer. It's only used to follow your hand, and it's never saved or sent anywhere.</p>
        <div class="buttons">
          <button id="use-camera" type="button">📷 Use my camera</button>
          <button id="use-mouse" type="button">🖱️ Use the mouse</button>
        </div>
        <p class="note" id="mix-intro-note" aria-live="polite"></p>
      </div>
    </div>

    <div id="tutorial" aria-live="polite">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <!-- going round (mixing) -->
        <g id="tutorial-circle">
          <circle class="track" cx="32" cy="32" r="22" />
          <path class="arrow" d="M54 26 l4 8 l-9 -1 z" />
        </g>
        <!-- forward and back (rolling) -->
        <g id="tutorial-line" style="display: none">
          <line class="track" x1="32" y1="10" x2="32" y2="54" />
          <path class="arrow" d="M32 3 l6 8 h-12 z M32 61 l6 -8 h-12 z" />
        </g>
        <text id="tutorial-icon" font-size="18" text-anchor="middle" dominant-baseline="central">
          ✋
          <animateMotion id="tutorial-motion" dur="1.6s" repeatCount="indefinite" path="M32,10 a22,22 0 1,1 -0.01,0" />
        </text>
      </svg>
      <div><b id="tutorial-text"></b><small id="tutorial-small"></small></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
